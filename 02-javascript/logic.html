    <script>
      // PRIME NUMBER
      function Prime() {
        let a = parseInt(document.getElementById("input-1").value);
        var b = 0;
        if (a == 1 || a == 2 || a == 3)
          document.getElementById("output-1").value = "Prime Number";
        else if (a > 2 && a % 2 != 0) {
          for (let c = 3; c < a; c++) {
            if (a % c == 0) {
              b = 1;
              break;
            }
          }
          if (b != 1)
            document.getElementById("output-1").value = "Prime Number";
          else document.getElementById("output-1").value = " Not Prime Number";
        } else document.getElementById("output-1").value = "Not Prime Number";
      }

      // Prime Number to n
      function Prime_Num() {
        var i = parseInt(document.getElementById("input-2").value);
        var jj = [];
        var b;
        for (var a = 1; a <= i; a++) {
          b = 0;
          if (a == 1 || a == 2 || a == 3) jj.push(a);
          else if (a > 2 && a % 2 != 0) {
            for (let c = 3; c < a; c++) {
              if (a % c == 0) {
                b = 0;
                break;
              } else if (a % c != 0) {
                b = 1;
              }
            }
            if (b == 1) jj.push(a);
          }
        }
        document.getElementById("output-2").value = jj;
      }
      function Palindrome() {
        var str = document.getElementById("input-3").value;
        var copy = "";
        var n = str.length;
        for (var i = n - 1; i >= 0; i--) {
          copy += str.charAt(i);
        }
        if (str.includes(copy))
          document.getElementById("output-3").value = "It is palindrome";
        else document.getElementById("output-3").value = "It is not Palindrome";
      }
      function Title_Case() {
        var str = document.getElementById("input-4").value;
        var title = " ";
        for (i = 0; i <= str.length; i++) {
          if (i == 0 && str.charAt(i) != " ")
            title += str.charAt(i).toUpperCase();
          else if (str.charAt(i) != " ") title += str.charAt(i);
          else {
            while (str.charAt(i) == " ") {
              title += str.charAt(i) + str.charAt(i + 1).toUpperCase();
              i++;
            }
          }
          document.getElementById("output-4").value = title;
        }
      }

      function Array_large_small() {
        var ch = window.prompt("enter the number");
        var arr = [];
        for (var i = 0; i < ch; i++)
          arr.push(parseInt(window.prompt("Enter array 1 Element" + (i + 1))));
        arr.sort();
        document.getElementById("input-5").value =
          "The Smallest value is :" + arr[0];
        document.getElementById("output-5").value =
          "The Largest  value is:" + arr[arr.length - 1];
      }

      function fibonacci() {
        var a = parseInt(document.getElementById("input-6").value);
        let n1 = 0,
          n2 = 1,
          nextTerm;
        var b = [];
        for (let i = 1; i <= a; i++) {
          b.push(n1);
          nextTerm = n1 + n2;
          n1 = n2;
          n2 = nextTerm;
        }
        document.getElementById("output-6").value = b;
      }

      function unique() {
        var a = parseInt(document.getElementById("input-7").value);
        var b = [],
          b1 = [];
        var n = 0,
          i = 0,
          l = 0;
        k = 0;
        for (i = 0; i < a; i++)
          b[i] = parseInt(window.prompt("enter the number " + (i + 1)));

        while (n < a) {
          k = 0;
          for (i = 0; i < a; i++) {
            if (b[n] == b[i] && n != i) {
              k = 1;
            }
          }
          if (k == 0) {
            b1[l] = b[n];
            l++;
          } else {
            k = 0;
          }
          n++;
        }
        document.getElementById("output-7").value = b1;
      }

      function Flatten() {
        var p = [];
        var m = parseInt(document.getElementById("input-8").value);
        var x = [];
        for (i = 0; i < m; i++) {
          x[i] = [];
          var n = parseInt(window.prompt("Enter the Column size of" + (i + 1)));
          for (var j = 0; j < n; j++)
            x[i].push(parseInt(window.prompt("Enter the element")));
        }
        for (var i = 0; i < x.length; i++) {
          for (var j = 0; j < x[i].length; j++) p.push(x[i][j]);
        }
        document.getElementById("output-8").value = p;
      }

      function merge() {
        var i, j;
        var n = parseInt(document.getElementById("input-9").value);

        var m = parseInt(document.getElementById("input-10").value);
        var a = [];
        for (i = 0; i < n; i++)
          a.push(parseInt(window.prompt("Enter array 1 Element" + (i + 1))));
        var b = [];
        for (i = 0; i < m; i++)
          b.push(parseInt(window.prompt("Enter array 2 Element" + (i + 1))));
        var c = [];
        for (var i = 0; i < n; i++) c[i] = a[i];
        for (var i = 0; i < m; i++) c[n + i] = b[i];
        var x = c.length;
        for (i = 0; i < x; i++) {
          var v = c[i];
          for (j = i - 1; j >= 0 && c[j] > v; j--) c[j + 1] = c[j];
          c[j + 1] = v;
        }
        document.getElementById("output-9").value = c;
      }
